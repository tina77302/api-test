services:
  - type: web
    name: ai-ratescope
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-web.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BOK_ECOS_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
