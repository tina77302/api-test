name: Update RateScope forecast

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. 00:15 UTC = 09:15 Korea time.
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: ratescope-forecast-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Update data and forecasts
        run: python -m automation.update_forecast

      - name: Commit changed forecast artifacts
        run: |
          git config user.name "ratescope-bot"
          git config user.email "ratescope-bot@users.noreply.github.com"
          git add data/raw data/live data/processed outputs
          if git diff --cached --quiet; then
            echo "No forecast changes"
            exit 0
          fi
          git commit -m "Update RateScope forecast data"
          git push
